; Presets de exportacion de la version grafica.
;
; Versionado a proposito (y por eso sale de .gitignore): sin el, el job
; de release no tiene de donde sacar como empaquetar el juego, y lo que
; se publique dependeria de lo que cada uno tenga configurado en su
; editor. Godot lo reescribe si se tocan los ajustes de exportacion
; desde el editor, asi que conviene revisar el diff antes de commitear.
;
; embed_pck=true deja un unico fichero por plataforma en vez de
; ejecutable + .pck suelto: quien lo descargue no puede separarlos por
; accidente ni olvidarse de copiar uno de los dos.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="../dist/tambor-del-juicio-linux.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="../dist/tambor-del-juicio-windows.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
