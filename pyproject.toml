[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tambor-del-juicio"
version = "0.2.0"
description = "El Tambor del Juicio: juego de deduccion y riesgo sobre un tambor de ficcion, en terminal (Python puro) y en 2D (Godot)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Izan" },
]

[project.scripts]
ruleta = "terminal.ruleta:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "black>=24",
    "coverage>=7.4",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["terminal"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.coverage.run]
source = ["terminal"]
omit = ["terminal/test_*.py"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
files = ["terminal", "empaquetado"]
exclude = ["terminal/test_.*\\.py$"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
