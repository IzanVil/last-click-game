[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "russian-roulette-2d"
version = "0.1.0"
description = "Minijuego de ruleta rusa de ficcion: version de terminal en Python puro y version grafica 2D en Godot."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Izan" },
]

[project.scripts]
ruleta = "terminal.ruleta:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "black>=24",
    "coverage>=7.4",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["terminal"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Reglas por defecto de ruff (pyflakes + un subconjunto de pycodestyle)
# mas: E (pycodestyle completo, incluye E501 line-too-long), I (orden de
# imports) y UP (sugerencias de sintaxis moderna acorde a requires-python).
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.coverage.run]
# Solo interesa medir el codigo de la app, no los propios ficheros de
# tests: su "cobertura" no dice nada util.
source = ["terminal"]
omit = ["terminal/test_*.py"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
# Toda la app (ruleta.py y los modulos de logica pura que importa), no
# los propios ficheros de tests: igual que [tool.coverage.run] mas
# arriba, exigirle anotaciones estrictas a cada metodo de test (y a cada
# mock que reciben) seria ruido, no senal.
files = ["terminal"]
exclude = ["terminal/test_.*\\.py$"]
# El codigo ya venia con type hints en (casi) todas las firmas: esto
# solo hace explicito lo que se daba por hecho, no cambia el estilo.
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
